name: Sireum Cosmocc

on:
  workflow_dispatch:
  push:
    branches:
      - 'sireum-cc1-build-*'
    tags:
      - 'cosmocc-*-sireum.*'

permissions:
  contents: read

env:
  BOOTSTRAP_URL: https://github.com/jart/cosmopolitan/releases/download/4.0.2/cosmocc-4.0.2.zip

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-source:
    if: github.repository == 'sireum/cosmopolitan'
    runs-on: ubuntu-24.04
    outputs:
      archive: ${{ steps.source.outputs.archive }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Select the SDK source
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^cosmocc-[0-9]+\.[0-9]+\.[0-9]+-([a-f0-9]{8,40})-sireum\.[0-9]+$ ]]; then
              echo "Expected tag cosmocc-<upstream-version>-<upstream-base-sha>-sireum.<revision>" >&2
              exit 1
            fi
            git merge-base --is-ancestor "${BASH_REMATCH[1]}" "$commit"
            git merge-base --is-ancestor "$commit" refs/remotes/origin/sireum
            archive="$GITHUB_REF_NAME.zip"
          else
            archive="cosmocc-sireum-snapshot-${commit:0:12}.zip"
          fi
          printf 'archive=%s\ncommit=%s\n' "$archive" "$commit" >> "$GITHUB_OUTPUT"
  build-cc1:
    needs: select-source
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-source.outputs.commit }}
          persist-credentials: false
      - name: Prepare the GCC runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binfmt-support bison flex libtool qemu-user-static texinfo
          sudo update-binfmts --enable qemu-aarch64
          test -r /proc/sys/fs/binfmt_misc/qemu-aarch64
          sudo install -d -o "$(id -un)" -m 755 /zip
          sudo install -m 755 build/bootstrap/ape.elf /usr/bin/ape
          printf '%s\n' ':APE:M::MZqFpD::/usr/bin/ape:' | sudo tee /proc/sys/fs/binfmt_misc/register
      - name: Rebuild the patched GCC front end
        env:
          TARGET: ${{ matrix.target }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cosmocc-bootstrap.zip" "$BOOTSTRAP_URL"
          tool/cosmocc/rebuild-sireum-cc1.sh \
            "$TARGET" "$RUNNER_TEMP/cosmocc-bootstrap.zip" "$RUNNER_TEMP/cc1-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cc1-${{ matrix.target }}
          path: ${{ runner.temp }}/cc1-${{ matrix.target }}/
          if-no-files-found: error

  build-cosmocc:
    needs: [select-source, build-cc1]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select-source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cc1-*
          merge-multiple: true
          path: ${{ runner.temp }}/cc1
      - name: Prepare the packaging runner
        run: |
          if ! command -v bsdtar >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libarchive-tools
          fi
          sudo install -m 755 build/bootstrap/ape.elf /usr/bin/ape
          printf '%s\n' ':APE:M::MZqFpD::/usr/bin/ape:' | sudo tee /proc/sys/fs/binfmt_misc/register
      - name: Package and verify the SDK
        env:
          ARCHIVE: ${{ needs.select-source.outputs.archive }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cosmocc-bootstrap.zip" "$BOOTSTRAP_URL"
          mkdir release
          tool/cosmocc/package-sireum.sh \
            "$RUNNER_TEMP/cosmocc-bootstrap.zip" "$RUNNER_TEMP/cc1" "release/$ARCHIVE"
          cd release
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sireum-cosmocc
          path: release/
          compression-level: 0
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [select-source, build-cosmocc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sireum-cosmocc
          path: release
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ needs.select-source.outputs.archive }}
          SOURCE_COMMIT: ${{ needs.select-source.outputs.commit }}
        working-directory: release
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq .sha)
          test "$tagged_commit" = "$SOURCE_COMMIT"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" \
            --notes "Sireum Cosmocc SDK built from $SOURCE_COMMIT with the patched GCC 14.1.0 C front ends."
